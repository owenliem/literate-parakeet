name: PRISMA database search audit

on:
  push:
    branches:
      - prisma-search-audit-20260813
    paths:
      - prisma_search_20260813_v2.py
      - .github/workflows/prisma-search-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: prisma-search-audit-20260813
      - name: Run fielded database searches
        run: python prisma_search_20260813_v2.py
      - name: Show count log
        run: cat prisma_search_outputs_v2/search_counts.json
      - name: Upload complete search audit
        uses: actions/upload-artifact@v4
        with:
          name: prisma-search-audit-20260813-v2
          path: prisma_search_outputs_v2/
          if-no-files-found: error
      - name: Commit timestamped outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma_search_outputs_v2
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Add fielded PRISMA search outputs"
            git push origin HEAD:prisma-search-audit-20260813
          fi
